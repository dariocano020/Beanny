<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cápsulas Espresso - Tienda</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Space+Grotesk:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body id="body-capsulas">

    <div id="cursor-capsulas"></div>

    <main id="main-container-capsulas">
        <header id="header-tienda-capsulas">
            <h1 id="logo-texto-capsulas">Tienda</h1>
            <p id="subtitulo-capsulas">Selección premium compatible con Espresso</p>
        </header>

        
    
    <script>
        const cursor = document.getElementById('cursor-capsulas');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>

        
</body>
</html>
